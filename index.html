  <button class="nb" data-t="tasks" onclick="go('tasks')"><i data-i="tasks"></i>Tasks</button>
  <button id="fab" onclick="ef()" aria-label="Add task"><i data-i="plus"></i><span class="lb">New task</span></button>
  <button class="nb" data-t="set" onclick="go('set')"><i data-i="gear"></i>Settings</button>

<script>
/* =========================================================
   Setup: helpers, state and storage
   ========================================================= */

const $ = s => document.querySelector(s);
const K = 'tickd-v1';
const ov = $('#ov');

// Default app state
const mk = () => ({
  name: '',
  goal: 0,
  setup: false,
  accent: '#14161f',
  mode: 'system',
  view: 'list',
  avatar: '',
  tags: ['Work', 'Personal', 'Study', 'Health'],
  tasks: []
});

// Load saved state, falling back to defaults
let S = (() => {
  try {
    return { ...mk(), ...JSON.parse(localStorage.getItem(K) || '{}') };
  } catch (e) {
    return mk();
  }
})();

const save = () => {
  try {
    localStorage.setItem(K, JSON.stringify(S));
  } catch (e) {}
};


/* =========================================================
   Icons
   ========================================================= */

const IC = {
  home: '<path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z"/>',
  tasks: '<rect x="4" y="4" width="16" height="16" rx="5"/><path d="m8.6 12.2 2.4 2.4 4.4-4.8"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  help: '<circle cx="12" cy="12" r="8.5"/><path d="M9.7 9.6a2.4 2.4 0 1 1 3.4 2.2c-.7.4-1.1.9-1.1 1.7M12 16.6v.1"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>',
  list: '<path d="M5 7h14M5 12h14M5 17h14"/>',
  grid: '<rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/>',

Object.assign(IC, {

  next: '<path d="m9.5 6 6 6-6 6"/>',

});

const ic = (n, s = 22) =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

// Migrate the old green default accent
if (S.accent == '#2f9e78') S.accent = '#14161f';


/* =========================================================
   UI state and small utilities
   ========================================================= */

let tab = 'home';          // current tab: home | tasks | set
let f = 'all';             // task filter
let q = '';                // search query
let cal = { m: 'month', ref: new Date(), sel: null };  // calendar state
let fm = {};               // task form state (tag, priority, id)

const pad = n => String(n).padStart(2, '0');

const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

// Escape text for safe use in HTML
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// Due date as a Date object, or null
const due = t => t.date ? new Date(t.date + 'T' + (t.time || '23:59')) : null;

const over = t => !t.done && due(t) && due(t) < new Date();

// "13:05" -> "1:05 PM"
const fT = t => {
  if (!t) return '';
  const [h, m] = t.split(':');
  return (h % 12 || 12) + ':' + m + ' ' + (h < 12 ? 'AM' : 'PM');
};

// Date label: "Today" or "5 Oct"
const lbl = d =>
  d == ymd(new Date())
    ? 'Today'
    : new Date(d + 'T00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short' });

// "Overdue" or "3d overdue"
const odT = t => {
  const n = Math.floor((Date.now() - due(t)) / 864e5);
  return n < 1 ? 'Overdue' : n + 'd overdue';
};

const toast = m => {
  const e = $('#toast');
  e.textContent = m;
  e.style.display = 'block';
  clearTimeout(toast.i);
  toast.i = setTimeout(() => e.style.display = 'none', 2200);
};


/* =========================================================
   Character counter for the name field
   ========================================================= */

function cnt(el) {
  const c = $('#nc');
  c.textContent = el.value.length + '/' + el.maxLength;
  c.classList.toggle('full', el.value.length >= el.maxLength);
}


/* =========================================================
   Theme
   ========================================================= */

function theme() {
  const dark = S.mode == 'dark' ||
    (S.mode == 'system' && matchMedia('(prefers-color-scheme:dark)').matches);
  const root = document.documentElement;

  // Perceived brightness of a hex colour, 0 to 1
  const L = c => {
    const n = parseInt(c.slice(1), 16);
    return (.299 * (n >> 16) + .587 * (n >> 8 & 255) + .114 * (n & 255)) / 255;
  };

  let a = S.accent;
  if (dark && L(a) < .3) a = '#f2f3f5';   // keep dark accents visible in dark mode

  root.dataset.t = dark ? 'dark' : 'light';
  root.style.setProperty('--raw', S.accent);
  root.style.setProperty('--ac', a);
  root.style.setProperty('--on', L(a) > .62 ? '#111' : '#fff');
}


/* =========================================================
   Bottom sheets and navigation
   ========================================================= */

const sheet = h => {
  ov.innerHTML = '<div class="sh">' + h + '</div>';
  ov.classList.add('on');
};

const cl = () => ov.classList.remove('on');

ov.onclick = e => {
  if (e.target == ov) cl();
};

document.onkeydown = e => {
  if (e.key == 'Escape') cl();
};

function go(t) {
  tab = t;
  render();
  scrollTo(0, 0);
}

// Update the clock on the home screen
function tick() {
  const e = $('#clk');
  if (!e) return;
  const n = new Date();
  e.textContent =
    n.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }) +
    ', ' +
    n.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

setInterval(tick, 15000);

function render() {
  theme();
  document.querySelectorAll('.nb').forEach(b => b.classList.toggle('on', b.dataset.t == tab));
  $('#main').innerHTML = '<div class="w">' + ({ home: H, tasks: T, set: G })[tab]() + '</div>';
  tick();
}


/* =========================================================
   Task card and completion toggle
   ========================================================= */

const card = t => {
  const when = t.date
    ? `<div class="tmr">${lbl(t.date)}${t.time ? ', ' + fT(t.time) : ''}</div>`
    : '';

  const desc = t.desc ? `<div class="ds">${esc(t.desc)}</div>` : '';

  // Kept on one line inside .mt so the :empty rule still works
  const meta =
    (t.tag ? `<span class="tg">${esc(t.tag)}</span>` : '') +
    (t.pri == 'High' ? '<span class="tg hi">High</span>' : '') +
    (over(t) ? `<span class="od">${odT(t)}</span>` : '');

  return `<div class="tk${t.done ? ' dn' : ''}" tabindex="0" role="button" onclick="vw('${t.id}')" onkeydown="if(event.key=='Enter')vw('${t.id}')">
    <div class="tb">
      ${when}
      <div class="tt ${t.done ? 'dn' : ''}">${esc(t.title)}</div>
      ${desc}
      <div class="mt">${meta}</div>
    </div>
    <button class="cb ${t.done ? 'on' : ''}" aria-label="Toggle done" onclick="event.stopPropagation();tg('${t.id}')">${t.done ? ic('check', 20) : ''}</button>
  </div>`;
};

// Sort: pending first, then by due date (undated last)
const srt = a => a.sort((a, b) => a.done - b.done || (due(a) || 9e15) - (due(b) || 9e15));

function tg(id) {
  const t = S.tasks.find(x => x.id == id);
  t.done = !t.done;
  t.doneAt = t.done ? Date.now() : null;
  save();
  render();
}


/* =========================================================
   HOME tab
   ========================================================= */

function H() {
  const n = S.tasks;
  const dn = n.filter(t => t.done).length;
  const pe = n.length - dn;
  const ov = n.filter(over).length;
  const td = ymd(new Date());
  const tdn = n.filter(t => t.done && t.doneAt && ymd(new Date(t.doneAt)) == td).length;

  const av = S.avatar
    ? `<img class="av" src="${S.avatar}" alt="">`
    : `<div class="av">${esc((S.name || 'T')[0].toUpperCase())}</div>`;

  const sub = !n.length
    ? "Add your first task when you're ready."
    : pe
      ? `${pe} task${pe > 1 ? 's' : ''} still to go.`
      : 'All clear. Nice work.';

  // Shrink the greeting as the name gets longer
  const gr = 'Hey ' + (S.name || 'there') + '!';
  const fs = gr.length <= 12 ? 34 : gr.length <= 15 ? 29 : gr.length <= 18 ? 25 : 22;

  let h = `<div class="hd">
    <div style="min-width:0">
      <p class="mu" id="clk" style="font-size:14px"></p>
      <h2 class="pt" style="font-size:${fs}px">${esc(gr)}</h2>
      <p class="mu">${S.setup ? sub : 'Set up Tickd to make it yours.'}</p>
    </div>
    ${av}
  </div>`;

  // First-run setup card
  if (!S.setup) {
    return h + `<div class="card">
      <h3>Let's set you up</h3>
      <p class="mu">Add your name and a daily goal. You can change both later in Settings.</p>
      <br>
      <label for="sn" class="lc">Your name <span class="cnt" id="nc">0/16</span></label>
      <input id="sn" class="in" placeholder="e.g. Lipton" maxlength="16" oninput="cnt(this)">
      <label for="sg">Tasks to finish each day</label>
      <input id="sg" class="in" type="number" min="1" max="50" placeholder="e.g. 3">
      <button class="bt" onclick="setup()">Save and start</button>
    </div>`;
  }

  // Stat tiles
  h += `<div class="g2">
    <div class="st"><b>${n.length}</b><span>Total</span></div>
    <div class="st"><b>${dn}</b><span>Completed</span></div>
    <div class="st"><b>${pe}</b><span>Pending</span></div>
    <div class="st"><b style="${ov ? 'color:var(--rd)' : ''}">${ov}</b><span>Overdue</span></div>
  </div>`;

  // Daily goal ring, or a prompt to set a goal
  if (S.goal) {
    const pct = Math.min(100, Math.round(tdn / S.goal * 100));
    h += `<div class="hero">
      <div class="ring" style="--p:${pct}"><b>${pct}%</b></div>
      <div>
        <small>Today's goal</small>
        <h2>${tdn} of ${S.goal} done</h2>
        <p>${tdn >= S.goal ? 'Goal hit. Nice work.' : (S.goal - tdn) + ' more to reach it.'}</p>
      </div>
    </div>`;
  } else {
    h += `<div class="card">
      <h3>No daily goal yet</h3>
      <p class="mu">Set one in Settings to track your progress here.</p>
    </div>`;
  }

  // Next three pending tasks
  const up = srt(n.filter(t => !t.done)).slice(0, 3);

  h += `<div class="hd">
    <h3>Up next</h3>
    <button class="ch" onclick="go('tasks')">All tasks</button>
  </div>`;

  h += up.length
    ? `<div class="lst">${up.map(card).join('')}</div>`
    : `<div class="card emp">Nothing waiting.<br><br><button class="bt sm" onclick="ef()">Add a task</button></div>`;

  return h;
}

function setup() {
  S.name = $('#sn').value.trim();
  S.goal = Math.max(0, Math.floor(+$('#sg').value) || 0);
  S.setup = true;
  save();
  render();
}


/* =========================================================
   TASKS tab: calendar
   ========================================================= */

function CAL() {
  const r = cal.ref;
  const ds = new Set(S.tasks.map(t => t.date));   // days that have tasks
  const td = ymd(new Date());
  let s, n, ti;                                   // start date, cell count, title
  const sd = (d, o) => d.toLocaleDateString(undefined, o);

  if (cal.m == 'month') {
    const f = new Date(r.getFullYear(), r.getMonth(), 1);
    const dm = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate();
    s = new Date(f);
    s.setDate(1 - f.getDay());
    n = Math.ceil((f.getDay() + dm) / 7) * 7;
    ti = sd(r, { month: 'long', year: 'numeric' });
  } else {
    s = new Date(r);
    s.setDate(r.getDate() - r.getDay());
    n = 7;
    const e = new Date(s);
    e.setDate(s.getDate() + 6);
    ti = sd(s, { day: 'numeric', month: 'short' }) + ' to ' + sd(e, { day: 'numeric', month: 'short' });
  }

  // Weekday headers, then one button per day
  let c = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(x => `<small>${x}</small>`).join('');

  for (let i = 0; i < n; i++) {
    const d = new Date(s);
    d.setDate(s.getDate() + i);
    const y = ymd(d);

    const cls = 'd' +
      (cal.m == 'month' && d.getMonth() != r.getMonth() ? ' o' : '') +
      (y == cal.sel ? ' s' : '') +
      (y == td ? ' t' : '') +
      (ds.has(y) ? ' k' : '');

    c += `<button class="${cls}" onclick="pd('${y}')">${d.getDate()}</button>`;
  }

  const modes = [['month', 'Month'], ['week', 'Week']]
    .map(a => `<button class="ch ${cal.m == a[0] ? 'on' : ''}" onclick="cal.m='${a[0]}';render()">${a[1]}</button>`)
    .join('');

  return `<div class="card dk">
    <div class="ct">
      <button class="ib" onclick="sh(-1)" aria-label="Previous">${ic('prev', 20)}</button>
      <b>${ti}</b>
      <button class="ib" onclick="sh(1)" aria-label="Next">${ic('next', 20)}</button>
    </div>
    <div class="row" style="margin-bottom:10px">
      ${modes}
      <button class="ch" onclick="cal.ref=new Date();cal.sel=ymd(new Date());render()">Today</button>
    </div>
    <div class="cal">${c}</div>
  </div>`;
}

// Move the calendar forward or back by one month or week
const sh = n => {
  const r = cal.ref;
  cal.m == 'month' ? r.setMonth(r.getMonth() + n, 1) : r.setDate(r.getDate() + 7 * n);
  render();
};

// Pick a day (tap again to clear)
const pd = y => {
  cal.sel = cal.sel == y ? null : y;
  render();
};


/* =========================================================
   TASKS tab: list and page
   ========================================================= */

function LST() {
  const L = srt(S.tasks.filter(t =>
    (!cal.sel || t.date == cal.sel) &&
    (!q || (t.title + ' ' + t.desc).toLowerCase().includes(q)) &&
    (
      f == 'all' ||
      (f == 'pending' && !t.done) ||
      (f == 'done' && t.done) ||
      (f == 'over' && over(t)) ||
      (f.startsWith('g:') && t.tag == f.slice(2))
    )
  ));

  return L.length
    ? L.map(card).join('')
    : `<div class="emp">${S.tasks.length ? 'Nothing matches this filter.' : 'No tasks yet. Tap + to add your first one.'}</div>`;
}

function T() {
  const fl = [
    ['all', 'All'],
    ['pending', 'Pending'],
    ['done', 'Completed'],
    ['over', 'Overdue'],
    ...S.tags.map(x => ['g:' + x, x])
  ];

  const selBar = cal.sel
    ? `<div class="bar">
        <b>${new Date(cal.sel + 'T00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' })}</b>
        <span><button class="bt sm" onclick="ef('','${cal.sel}')">Add task</button> <button class="ch" onclick="pd('${cal.sel}')">Clear</button></span>
      </div>`
    : '';

  const chips = fl
    .map(a => `<button class="ch ${f == a[0] ? 'on' : ''}" data-f="${esc(a[0])}" onclick="f=this.dataset.f;render()">${esc(a[1])}</button>`)
    .join('');

  return `<div class="hd">
    <h2 class="pt">Tasks</h2>
    <button class="ib" onclick="S.view=S.view=='grid'?'list':'grid';save();render()" aria-label="Switch grid or list view">${ic(S.view == 'grid' ? 'list' : 'grid', 20)}</button>
  </div>
  ${CAL()}
  ${selBar}
  <div class="sb">
    ${ic('search', 20)}
    <input type="search" placeholder="Search tasks" value="${esc(q)}" oninput="q=this.value.toLowerCase();$('#lst').innerHTML=LST()" aria-label="Search tasks">
  </div>
  <div class="row">${chips}</div>
  <div id="lst" class="lst ${S.view == 'grid' ? 'grid' : ''}">${LST()}</div>`;
}


/* =========================================================
   Sheets: view, add/edit and delete a task
   ========================================================= */

// View a task
function vw(id) {
  const t = S.tasks.find(x => x.id == id);
  if (!t) return;

  const when = t.date
    ? `<span class="tm">${lbl(t.date)}${t.time ? ', ' + fT(t.time) : ''}</span>`
    : '<span class="tg">No date</span>';

  const status = t.done ? 'Completed' : over(t) ? odT(t) : 'Pending';

  sheet(`<div class="sr">
    <button class="ib" onclick="cl()" aria-label="Close">${ic('close', 20)}</button>
    <button class="ib" onclick="ef('${id}')" aria-label="Edit">${ic('edit', 20)}</button>
  </div>
  <div style="text-align:center">
    ${when}
    <h2>${esc(t.title)}</h2>
    <p class="${over(t) ? 'od' : 'mu'}">${status}${t.tag ? ' · ' + esc(t.tag) : ''} · ${t.pri} priority</p>
  </div>
  <p style="margin:16px 0;white-space:pre-wrap">${t.desc ? esc(t.desc) : '<span class="mu">No description.</span>'}</p>
  <button class="bt" onclick="tg('${id}');cl()">${t.done ? 'Mark as pending' : 'Mark as done'}</button>`);
}

// Tag chips and priority chips inside the task form
const tc = () => S.tags.length
  ? S.tags.map((x, i) => `<button class="ch ${fm.tag == x ? 'on' : ''}" onclick="pt(${i})">${esc(x)}</button>`).join('')
  : '<span class="mu">Add tags in Settings.</span>';

const pc = () => ['Low', 'Medium', 'High']
  .map(x => `<button class="ch ${fm.pri == x ? 'on' : ''}" onclick="fm.pri='${x}';$('#fpr').innerHTML=pc()">${x}</button>`)
  .join('');

// Toggle a tag in the form
const pt = i => {
  fm.tag = fm.tag == S.tags[i] ? '' : S.tags[i];
  $('#ftg').innerHTML = tc();
};

// Add or edit a task
function ef(id, date) {
  const t = S.tasks.find(x => x.id == id) || {
    title: '',
    desc: '',
    date: date || ymd(cal.sel ? new Date(cal.sel + 'T00:00') : new Date()),
    time: '',
    tag: '',
    pri: 'Medium'
  };

  fm = { id: id || '', tag: t.tag, pri: t.pri };

  sheet(`<div class="sr">
    <button class="ib" onclick="cl()" aria-label="Close">${ic('close', 20)}</button>
    <h3 style="align-self:center">${id ? 'Edit task' : 'New task'}</h3>
    <span style="width:40px"></span>
  </div>
  <input id="ft" class="in" placeholder="Task title" maxlength="120" value="${esc(t.title)}" aria-label="Task title">
  <textarea id="fd" class="in" rows="3" placeholder="Description (optional)">${esc(t.desc)}</textarea>
  <div class="two">
    <div>
      <label for="fa">Date</label>
      <input id="fa" type="date" class="in" value="${t.date}">
    </div>
    <div>
      <label for="fi">Time</label>
      <input id="fi" type="time" class="in" value="${t.time}">
    </div>
  </div>
  <label>Tag</label>
  <div class="wrap" id="ftg">${tc()}</div>
  <label>Priority</label>
  <div class="wrap" id="fpr">${pc()}</div>
  <p id="er" class="od"></p>
  <button class="bt" onclick="sv()">${id ? 'Save changes' : 'Add task'}</button>
  ${id ? `<button class="bt d" onclick="dl('${id}')">Delete task</button>` : ''}`);

  setTimeout(() => {
    if (!id) $('#ft').focus();
  }, 50);
}

// Save the task form
function sv() {
  const ti = $('#ft').value.trim();

  if (!ti) {
    $('#er').textContent = 'Add a title to save this task.';
    return;
  }

  const o = {
    title: ti,
    desc: $('#fd').value.trim(),
    date: $('#fa').value,
    time: $('#fi').value,
    tag: fm.tag,
    pri: fm.pri
  };

  if (fm.id) {
    Object.assign(S.tasks.find(x => x.id == fm.id), o);
  } else {
    S.tasks.push({ id: uid(), done: false, doneAt: null, ...o });
  }

  save();
  cl();
  render();
}

// Delete a task (after confirming)
const dl = id => ask('Delete this task?', () => {
  S.tasks = S.tasks.filter(x => x.id != id);
  save();
  render();
});

// Generic confirmation sheet
function ask(m, cb, l = 'Delete') {
  sheet(`<h3>${m}</h3>
  <p class="mu">This can't be undone.</p>
  <br>
  <button class="bt" style="background:var(--rd)" id="yes">${l}</button>
  <button class="bt g" onclick="cl()">Cancel</button>`);

  $('#yes').onclick = () => {
    cl();
    cb();
  };
}


/* =========================================================
   Help walkthrough
   ========================================================= */

const HS = [
  ['Home', 'Your progress and daily goal live here. Set your name and goal to make it yours.'],
  ['Add tasks', 'Tap + to add a task. Tap any task to view it, and tick the box to complete it.'],
  ['Calendar', 'Browse by month or week. Tap a day to see its tasks or add one for it.'],
  ['Find things', 'Filter by status or tag, search by word, and switch between grid and list.'],
  ['Settings', 'Change the theme and colour, manage tags, and export or import a backup.']
];

function hp(i) {
  const last = i == HS.length - 1;

  sheet(`<div class="sr">
    <button class="ib" onclick="cl()" aria-label="Close">✕</button>
    <span class="mu">${i + 1} of ${HS.length}</span>
  </div>
  <h2>${HS[i][0]}</h2>
  <p style="min-height:70px">${HS[i][1]}</p>
  <div class="two">
    ${i ? `<button class="bt g" onclick="hp(${i - 1})">Back</button>` : '<span></span>'}
    <button class="bt" onclick="${last ? 'cl()' : `hp(${i + 1})`}">${last ? 'Done' : 'Next'}</button>
  </div>`);
}


/* =========================================================
   SETTINGS tab
   ========================================================= */

function G() {
  // Row of option chips that set S[k]
  const seg = (k, o) => `<div class="wrap">${
    o.map(a => `<button class="ch ${S[k] == a[0] ? 'on' : ''}" onclick="S.${k}='${a[0]}';save();render()">${a[1]}</button>`).join('')
  }</div>`;

  const avatar = S.avatar
    ? `<img class="av" src="${S.avatar}" alt="">`
    : `<div class="av">${esc((S.name || 'T')[0].toUpperCase())}</div>`;

  const removePhoto = S.avatar
    ? ' <button class="ch" onclick="S.avatar=\'\';save();render()">Remove</button>'
    : '';

  const swatches = ['#14161f', '#16a34a', '#5b4bdb', '#2563eb', '#e11d63', '#d97706']
    .map(c => `<button class="sw" style="background:${c}" onclick="S.accent='${c}';save();render()" aria-label="Accent ${c}"></button>`)
    .join('');

  const tagChips = S.tags
    .map((x, i) => `<button class="ch on" onclick="S.tags.splice(${i},1);save();render()" aria-label="Remove tag ${esc(x)}">${esc(x)} ${ic('close', 14)}</button>`)
    .join('') || '<span class="mu">No tags yet.</span>';

  return `<h2 class="pt">Settings</h2>

  <div class="card">
    <h3>Profile</h3>
    <div class="hd" style="justify-content:flex-start;margin:10px 0">
      ${avatar}
      <div><label class="ch" style="display:inline-block;cursor:pointer">Change photo<input type="file" accept="image/*" hidden onchange="pick(this)"></label>${removePhoto}</div>
    </div>
    <label for="sn" class="lc">Name <span class="cnt${S.name.length >= 16 ? ' full' : ''}" id="nc">${S.name.length}/16</span></label>
    <input id="sn" class="in" maxlength="16" value="${esc(S.name)}" oninput="cnt(this)" onchange="S.name=this.value.trim();S.setup=true;save();toast('Saved')">
    <label for="sg">Daily goal (tasks per day)</label>
    <input id="sg" class="in" type="number" min="0" max="50" style="margin-bottom:0" value="${S.goal || ''}" onchange="S.goal=Math.max(0,Math.floor(+this.value)||0);S.setup=true;save();toast('Saved')">
  </div>

  <div class="card">
    <h3>Appearance</h3>
    <label style="margin-top:10px">Theme</label>
    ${seg('mode', [['light', 'Light'], ['dark', 'Dark'], ['system', 'System']])}
    <label>Accent colour</label>
    <div class="wrap">${swatches}</div>
    <label for="ac">Custom colour</label>
    <input id="ac" type="color" value="${S.accent}" style="width:100%;height:46px;border:1px solid var(--bd);border-radius:14px;background:var(--cd);margin-top:6px" oninput="S.accent=this.value;theme()" onchange="save()">
  </div>

  <div class="card">
    <h3>Tasks</h3>
    <label style="margin-top:10px">Default view</label>
    ${seg('view', [['list', 'List'], ['grid', 'Grid']])}
    <label>Tags</label>
    <div class="wrap">${tagChips}</div>
    <div class="two" style="grid-template-columns:1fr auto">
      <input id="nt" class="in" maxlength="20" placeholder="New tag" style="margin:0">
      <button class="bt sm" onclick="at()">Add</button>
    </div>
  </div>

  <div class="card">
    <h3>Your data</h3>
    <p class="mu">Everything is saved on this device. Export a backup to keep it safe.</p>
    <br>
    <button class="bt g" onclick="ex()">Export as JSON</button>
    <label class="bt g" style="display:block;text-align:center;cursor:pointer;margin-top:8px;color:var(--ac)">Import from JSON<input type="file" accept=".json,application/json" hidden onchange="imp(this)"></label>
    <button class="bt d" onclick="ask('Reset everything?',()=>{S=mk();save();tab='home';render()},'Reset')">Reset all progress</button>
  </div>`;
}

// Add a new tag
function at() {
  const v = $('#nt').value.trim();
  if (v && !S.tags.includes(v)) {
    S.tags.push(v);
    save();
    render();
  }
}


/* =========================================================
   Export and import
   ========================================================= */

async function ex() {
  const data = JSON.stringify(S, null, 2);
  const name = 'tickd-backup-' + ymd(new Date()) + '.json';

  // Use the host's download capability when available
  try {
    const d = window.claude && await claude.use('downloads');
    if (d) {
      await d.save({ filename: name, data });
      return;
    }
  } catch (e) {
    if (e && e.code == 'declined') return;
  }

  // Fallback: normal browser download
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = name;
  a.click();
}

function imp(inp) {
  const fl = inp.files[0];
  inp.value = '';
  if (!fl) return;

  const r = new FileReader();

  r.onload = () => {
    let d;

    // Make sure the file looks like a Tickd backup
    try {
      d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.tasks)) throw 0;
    } catch (e) {
      toast('That file is not a Tickd backup.');
      return;
    }

    ask('Replace your current data with this file?', () => {
      const b = mk();

      S = {
        ...b,
        ...d,
        accent: /^#[0-9a-f]{6}$/i.test(d.accent) ? d.accent : b.accent,
        mode: ['light', 'dark', 'system'].includes(d.mode) ? d.mode : 'system',
        view: d.view == 'grid' ? 'grid' : 'list',
        tags: Array.isArray(d.tags) ? d.tags.map(String) : b.tags,
        tasks: d.tasks
          .filter(t => t && typeof t.title == 'string')
          .map(t => ({
            id: String(t.id || uid()),
            title: t.title,
            desc: String(t.desc || ''),
            date: t.date || '',
            time: t.time || '',
            tag: t.tag || '',
            pri: ['Low', 'Medium', 'High'].includes(t.pri) ? t.pri : 'Medium',
            done: !!t.done,
            doneAt: t.doneAt || null
          }))
      };

      save();
      render();
      toast('Backup loaded');
    }, 'Replace');
  };

  r.readAsText(fl);
}


/* =========================================================
   Profile photo: pick and crop
   ========================================================= */

function pick(inp) {
  const fl = inp.files[0];
  inp.value = '';
  if (!fl) return;

  const r = new FileReader();

  r.onload = () => {
    const im = new Image();
    im.onload = () => crop(im);
    im.onerror = () => toast('Could not read that image.');
    im.src = r.result;
  };

  r.readAsDataURL(fl);
}

function crop(im) {
  const W = 260;                                   // canvas size in px
  const base = W / Math.min(im.width, im.height);  // scale that fills the square
  let z = 1;                                       // zoom
  let ox = (W - im.width * base) / 2;              // image offset x
  let oy = (W - im.height * base) / 2;             // image offset y
  let p = null;                                    // last pointer position while dragging

  sheet(`<h3>Crop photo</h3>
  <p class="mu">Drag to move, use the slider to zoom. It saves as a square.</p>
  <canvas id="cv" width="260" height="260" style="width:260px;height:260px;display:block;margin:14px auto;border-radius:18px;touch-action:none;background:var(--bd)"></canvas>
  <input id="zm" type="range" min="1" max="3" step=".01" value="1" style="width:100%;accent-color:var(--ac)" aria-label="Zoom">
  <button class="bt" id="cu">Use photo</button>
  <button class="bt g" onclick="cl()">Cancel</button>`);

  const c = $('#cv');
  const x = c.getContext('2d');

  // Redraw, keeping the image covering the whole square
  const dr = () => {
    const s = base * z;
    const w = im.width * s;
    const h = im.height * s;
    ox = Math.min(0, Math.max(W - w, ox));
    oy = Math.min(0, Math.max(W - h, oy));
    x.clearRect(0, 0, W, W);
    x.drawImage(im, ox, oy, w, h);
  };

  dr();

  // Drag to move
  c.onpointerdown = e => {
    p = [e.clientX, e.clientY];
    c.setPointerCapture(e.pointerId);
  };

  c.onpointermove = e => {
    if (!p) return;
    ox += e.clientX - p[0];
    oy += e.clientY - p[1];
    p = [e.clientX, e.clientY];
    dr();
  };

  c.onpointerup = () => p = null;

  // Zoom around the centre
  $('#zm').oninput = e => {
    const n = +e.target.value;
    const m = W / 2;
    ox = m - (m - ox) * n / z;
    oy = m - (m - oy) * n / z;
    z = n;
    dr();
  };

  // Save the cropped square
  $('#cu').onclick = () => {
    S.avatar = c.toDataURL('image/jpeg', .85);
    save();
    cl();
    render();
  };
}


/* =========================================================
   Start
   ========================================================= */

matchMedia('(prefers-color-scheme:dark)').addEventListener('change', () => {
  if (S.mode == 'system') theme();
});

document.querySelectorAll('[data-i]').forEach(e => e.innerHTML = ic(e.dataset.i));

render();
</script>
</body>
</html>
